<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Post Project</title>
    <link rel="stylesheet" href="css/post-project.css" />
  </head>
  <body>
    <nav>
      <div class="nav-buttons">
        <a href="post-project.html">Post Project</a>
        <a href="register.html" class="active">Create Account</a>
        <a href="login.html">Login</a>
      </div>
    </nav>

    <a href="main-page.html" class="title">BranchOut</a>

    <main>
      <div class="input-form">
        <h1 class="form-title">Post Project</h1>
        <form id="register-form">
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter Project Name"
                required
            />
            <input
                type="text"
                id="description"
                name="description"
                placeholder="Enter Description"
                required
            />

            <div class="autocomplete">
            <input
                type="text"
                id="tag-search"
                name="tag"
                placeholder="Enter Tags"
            />
            </div>

            <div id="selectedTags"></div>

            <input
                type="text"
                id="github-link"
                name="github-link"
                placeholder="Enter Github Link"
                required
            >

            <input
                type="text"
                id="website-link"
                name="website-link"
                placeholder="Enter Website Link"
                required
            >

            <input
                type="text"
                id="communication-link"
                name="communication-link"
                placeholder="Enter Communication Link"
                required
            >
        </form>

    </main>

    <button type="submit" form="register-form" id="post-btn">Post</button>

    <footer>Footer</footer>

    <script src="js/post-project.js"></script>
  </body>
</html>
